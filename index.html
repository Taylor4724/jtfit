const WEEKPLAN=[
  {phase:"BUILD",note:"Baseline weight and sets. Hit the top of every rep range — tap ‹ ›  when you start a new week."},
  {phase:"BUILD",note:"Tapping › bumps every primary lift up by its increment, built on whatever weight you actually last used."},
  {phase:"RAMP",note:"+1 set added to every primary lift on top of another weight bump — volume and load both ramp."},
  {phase:"RAMP",note:"Volume holds, weight keeps climbing — hardest week of the block."},
  {phase:"PEAK",note:"Volume drops back to baseline, weight peaks — push for a rep PR at this weight."},
  {phase:"DELOAD",note:"Sets auto-cut roughly in half AND weight auto-drops to ~60% of wherever you left off. This week should feel easy."}
];
function cycleWeek(w){return ((w-1)%6)+1;}
function cycleNum(w){return Math.floor((w-1)/6)+1;}
function weekTarget(w,base){
  const wk=cycleWeek(w);
  if(wk<=2)return base;
  if(wk<=4)return base+1;
  if(wk===5)return base;
  return Math.max(1,Math.ceil(base/2));
}
function applySetTargetForDay(d,exState){
  WDAYS[d].sections.forEach(sec=>{
    if(!sec.primary)return;
    sec.groups.forEach(g=>g.exercises.forEach(e=>{
      const state=exState[e.id];if(!state)return;
      const target=weekTarget(W.week,e.sets);
      while(state.sets.length<target){const last=state.sets[state.sets.length-1];state.sets.push({weight:last.weight,reps:last.reps,done:false});}
      while(state.sets.length>target&&state.sets.length>1){state.sets.pop();}
    }));
  });
}
function applyWeekToDay(d){applySetTargetForDay(d,W.ex);}

// Builds and permanently saves a fresh slot for (d,newWeek), cascading weight from
// whatever was actually saved for (d,oldWeek) — the old week's data is never touched.
function bumpDayWeek(d,oldWeek,newWeek,deload){
  const base=initDay(d);
  const prevRaw=readWeekState(d,oldWeek);
  const cyclingFromDeload=cycleWeek(oldWeek)===6;
  const peakRaw=cyclingFromDeload?readWeekState(d,oldWeek-1):null;
  const events=[];
  WDAYS[d].sections.forEach(sec=>{
    const isPrimary=!!sec.primary;
    sec.groups.forEach(g=>g.exercises.forEach(e=>{
      const state=base[e.id];if(!state)return;
      const prevEx=prevRaw&&prevRaw[e.id]&&prevRaw[e.id].sets.length?prevRaw[e.id]:null;
      const peakEx=peakRaw&&peakRaw[e.id]&&peakRaw[e.id].sets.length?peakRaw[e.id]:null;

      // carry forward last known weight for every exercise before applying any bump logic
      if(prevEx){const carried=prevEx.sets[0].weight;state.sets.forEach(s=>{s.weight=carried;});}

      const target=weekTarget(newWeek,e.sets);
      while(state.sets.length<target){const last=state.sets[state.sets.length-1];state.sets.push({weight:last.weight,reps:e.repHi,done:false});}
      while(state.sets.length>target&&state.sets.length>1)state.sets.pop();

      if(isPrimary&&e.wtype!=='bodyweight'&&prevEx){
        const prevSets=prevEx.sets;
        const prevCur=prevSets[0].weight;
        const volume=prevSets.reduce((s,x)=>s+x.weight*x.reps,0);
        const maxReps=Math.max(...prevSets.map(x=>x.reps));
        const hitAll=prevSets.every(s=>s.reps>=e.repHi);

        recordHistory(e.id,{week:oldWeek,weight:prevCur,reps:maxReps,volume});

        let nw;
        if(cyclingFromDeload){
          // New cycle: restart from the pre-deload peak, not the reduced deload weight —
          // progress carries forward instead of resetting to the original baseline.
          nw=peakEx?peakEx.sets[0].weight:prevCur;
          events.push({name:e.name,type:'cycle',detail:'new cycle started at '+nw+'lb — carried from last cycle peak'});
        }else if(deload)nw=Math.round(prevCur*0.6/e.inc)*e.inc;
        else if(hitAll)nw=Math.round((prevCur+e.inc)*100)/100;
        else{nw=prevCur;events.push({name:e.name,type:'hold',detail:'held at '+prevCur+'lb — top reps not hit last week'});}
        state.sets.forEach(s=>{s.weight=nw;});
      }
      state.sets.forEach(s=>{s.reps=e.repHi;s.done=false;});
    }));
  });
  writeWeekState(d,newWeek,base);
  return events;
}

function plates(w){
  if(w<=45)return null;
  let s=Math.round(((w-45)/2)*100)/100;
  const pl=[45,35,25,15,10,5,2.5],r=[];
  for(const p of pl)while(s>=p-.001){r.push(p);s=Math.round((s-p)*100)/100;}
  return r.length?r:null;
}
function dW(w,t){return t==='bodyweight'?'BW':t==='added'?'+'+w+'lb':w+'lb';}
function ft(s){return Math.floor(s/60)+':'+(s%60+'').padStart(2,'0');}
function getEx(id){
  let found=null;
  Object.values(WDAYS).forEach(d=>d.sections.forEach(sec=>sec.groups.forEach(g=>g.exercises.forEach(e=>{if(e.id===id)found=e;}))));
  return found;
}
function getRest(id){
  let r=0;
  Object.values(WDAYS).forEach(d=>d.sections.forEach(sec=>sec.groups.forEach(g=>{if(g.exercises.some(e=>e.id===id))r=g.rest;})));
  return r;
}
function isPrimaryExercise(d,id){
  let found=false;
  WDAYS[d].sections.forEach(sec=>{if(sec.primary)sec.groups.forEach(g=>g.exercises.forEach(e=>{if(e.id===id)found=true;}));});
  return found;
}
function checkLivePR(id){
  const ex=getEx(id);if(!ex||ex.wtype==='bodyweight')return;
  if(!isPrimaryExercise(W.day,id))return;
  const state=W.ex[id];if(!state)return;

  if(!WEEK_SUMMARY||WEEK_SUMMARY.week!==W.week)WEEK_SUMMARY={week:W.week,byDay:{}};
  if(!WEEK_SUMMARY.byDay[W.day])WEEK_SUMMARY.byDay[W.day]=[];
  // recompute fresh each time so unchecking a set removes a badge that no longer applies
  WEEK_SUMMARY.byDay[W.day]=WEEK_SUMMARY.byDay[W.day].filter(e=>e.name!==ex.name);

  const allDone=state.sets.length>0&&state.sets.every(s=>s.done);
  if(!allDone)return;

  const volume=state.sets.reduce((s,x)=>s+x.weight*x.reps,0);
  const curWeight=state.sets[0].weight;
  const immediatePrev=getHistory(id).find(h=>h.week===W.week-1);

  if(!immediatePrev){
    WEEK_SUMMARY.byDay[W.day].push({name:ex.name,type:'pr-volume',detail:Math.round(volume)+'lb total volume — first tracked week'});
  }else if(volume>immediatePrev.volume){
    WEEK_SUMMARY.byDay[W.day].push({name:ex.name,type:'pr-volume',detail:Math.round(volume)+'lb total volume (up from '+Math.round(immediatePrev.volume)+'lb)'});
    if(curWeight>immediatePrev.weight)WEEK_SUMMARY.byDay[W.day].push({name:ex.name,type:'pr-weight',detail:curWeight+'lb (up from '+immediatePrev.weight+'lb)'});
  }else if(volume<immediatePrev.volume&&W.week!==6){
    WEEK_SUMMARY.byDay[W.day].push({name:ex.name,type:'regression',detail:'total volume down to '+Math.round(volume)+'lb from '+Math.round(immediatePrev.volume)+'lb the week before'});
  }
}

function mTotals(){
  const t={cal:0,protein:0,fat:0,carbs:0};
  MMEALS.forEach(m=>{const o=m.options.find(x=>x.id===M.sel[m.id]);if(o){t.cal+=o.cal;t.protein+=o.protein;t.fat+=o.fat;t.carbs+=o.carbs;}});
  if(M.oil){t.cal+=120;t.fat+=14;}
  return t;
}
function mStatus(mi,opt){
  const budget=currentMT().cal-(M.oil?120:0);
  let pc=0,pp=0;
  for(let i=0;i<mi;i++){const o=MMEALS[i].options.find(x=>x.id===M.sel[MMEALS[i].id]);if(o){pc+=o.cal;pp+=o.protein;}}
  const ac=pc+opt.cal,ap=pp+opt.protein,rem=budget-ac;
  const sub=MMEALS.slice(mi+1);
  if(!sub.length){
    if(ac>budget+80)return{code:'over',label:'OVER',msg:(ac-budget)+'cal over'};
    if(ap<PF)return{code:'lp',label:'LOW PRO',msg:'Only '+ap+'g protein'};
    if(ac>budget)return{code:'warn',label:'TIGHT',msg:(ac-budget)+'cal over'};
    if(ap>=currentMT().protein)return{code:'ideal',label:'IDEAL',msg:null};
    return{code:'ok',label:null,msg:null};
  }
  const minC=sub.reduce((s,m)=>s+Math.min(...m.options.map(o=>o.cal)),0);
  const maxP=sub.reduce((s,m)=>s+Math.max(...m.options.map(o=>o.protein)),0);
  if(rem<minC)return{code:'over',label:'OVER',msg:(minC-rem)+'cal short for '+sub.length+' more meals'};
  if(ap+maxP<PF)return{code:'lp',label:'LOW PRO',msg:'Max reachable: '+(ap+maxP)+'g'};
  if(rem-minC<70)return{code:'warn',label:'TIGHT',msg:(rem-minC)+'cal buffer'};
  return{code:'ok',label:null,msg:null};
}

/* ── WORKOUT EVENTS ────────────────────────────────────── */
function adjW(id,si,dir){
  const ex=getEx(id),s=W.ex[id].sets[si];
  if(ex.wtype==='bodyweight')return;
  const nw=Math.round(Math.max(0,Math.min(ex.max||999,s.weight+dir*ex.inc))*100)/100;
  s.weight=nw;
  document.getElementById('wv-'+id+'-'+si).textContent=dW(nw,ex.wtype);
  const pl=document.getElementById('pl-'+id+'-'+si);
  if(pl)pl.textContent=ex.wtype==='barbell'&&plates(nw)?(plates(nw).join('+')+' /side'):'';
  saveWorkout();
}
function adjR(id,si,dir){
  const s=W.ex[id].sets[si];
  s.reps=Math.max(1,Math.min(50,s.reps+dir));
  document.getElementById('rv-'+id+'-'+si).textContent=s.reps;
  saveWorkout();
}
function toggleDone(id,si,gr){
  const s=W.ex[id].sets[si],ex=getEx(id),color=DC[W.day];
  s.done=!s.done;
  const row=document.getElementById('sr-'+id+'-'+si);
  row.style.background=s.done?'#ffffff':'#161616';
  document.getElementById('wv-'+id+'-'+si).style.color=s.done?'#000':'#F0F0F0';
  document.getElementById('rv-'+id+'-'+si).style.color=s.done?'#000':'#F0F0F0';
  const setNum=row.querySelector('span');
  if(setNum)setNum.style.color=s.done?'#000':'#B8B8B8';
  const plEl=document.getElementById('pl-'+id+'-'+si);
  if(plEl)plEl.style.color=s.done?'#555':'#8a8a8a';
  const db=document.getElementById('db-'+id+'-'+si);
  db.style.borderColor=s.done?color:'#3a3a3a';
  db.style.background=s.done?color:'transparent';
  db.style.color=s.done?'#000':'#555';
  db.style.fontSize=s.done?'18px':'22px';
  db.textContent=s.done?'✓':'○';
  updateExCard(id,color);updateWProgress();
  if(s.done&&gr>0)startTimer(gr);
  saveWorkout();
  if(isPrimaryExercise(W.day,id)){
    checkLivePR(id);
    renderWorkout();
    return;
  }
}
function updateExCard(id,color){
  const state=W.ex[id];
  const done=state.sets.filter(s=>s.done).length,tot=state.sets.length,all=done===tot;
  const card=document.getElementById('ec-'+id);
  if(card){
    card.style.borderColor=all?color+'55':'#2a2a2a';
    const hdr=card.querySelector('.ex-hdr');
    if(hdr)hdr.style.background=all?color+'12':'#1c1c1c';
    const cnt=document.getElementById('ec-cnt-'+id);
    if(cnt){cnt.textContent=done+'/'+tot;cnt.style.color=all?color:'#707070';}
  }
}
function updateWProgress(){
  const d=W.day,color=DC[d],ids=allIds(d);
  const tot=ids.reduce((n,id)=>n+W.ex[id].sets.length,0);
  const dn=ids.reduce((n,id)=>n+W.ex[id].sets.filter(s=>s.done).length,0);
  const pct=tot?Math.round(dn/tot*100):0,fin=dn===tot&&tot>0;
  const pb=document.getElementById('wpb'),pt=document.getElementById('wpt');
  if(pb){pb.style.width=pct+'%';pb.style.background=fin?'#5ABF6A':color;}
  if(pt){pt.textContent=dn+'/'+tot+' sets · '+pct+'%';pt.style.color=fin?'#5ABF6A':color;}
}
function addSet(id){
  const sets=W.ex[id].sets,last=sets[sets.length-1];
  sets.push({weight:last.weight,reps:last.reps,done:false});
  const ex=getEx(id),color=DC[W.day];
  const c=document.getElementById('sets-'+id);
  if(c)c.innerHTML=sets.map((s,i)=>setRowH(id,i,s,ex,color,getRest(id))).join('');
  updateExCard(id,color);updateWProgress();saveWorkout();
}
function remSet(id){
  if(W.ex[id].sets.length<=1)return;
  W.ex[id].sets.pop();
  const ex=getEx(id),color=DC[W.day];
  const c=document.getElementById('sets-'+id);
  if(c)c.innerHTML=W.ex[id].sets.map((s,i)=>setRowH(id,i,s,ex,color,getRest(id))).join('');
  updateExCard(id,color);updateWProgress();saveWorkout();
}
function switchDay(d){
  W.day=d;
  W.ex=initDay(d);
  const existing=readWeekState(d,W.week);
  if(existing){
    Object.keys(existing).forEach(id=>{if(W.ex[id])W.ex[id]=existing[id];});
  }else{
    applyWeekToDay(d);
  }
  skipTimer();
  localStorage.setItem('trn3_wday',d);
  saveWorkout();
  renderWorkout();
}
let WEEK_SUMMARY=null;
function setWeek(dir){
  const oldWeek=W.week;
  const newWeek=Math.max(1,oldWeek+dir);
  if(newWeek===oldWeek)return;
  const forward=newWeek>oldWeek;
  if(forward&&cycleWeek(oldWeek)===6&&!isWeekFullyComplete(oldWeek))return;
  let byDay={};
  if(forward){
    // Moving into a week never visited before: cascade from the outgoing week's
    // actual saved results and permanently save a fresh, independent slot for it.
    ['A','B','C','D'].forEach(d=>{
      byDay[d]=bumpDayWeek(d,oldWeek,newWeek,cycleWeek(newWeek)===6);
    });
  }
  // Moving backward: the target week's slot already exists exactly as you left it —
  // nothing to compute, nothing to reset.
  W.week=newWeek;
  W.ex=initDay(W.day);
  const existing=readWeekState(W.day,W.week);
  if(existing){
    Object.keys(existing).forEach(id=>{if(W.ex[id])W.ex[id]=existing[id];});
  }else{
    applyWeekToDay(W.day);
  }
  const hasAny=forward&&Object.values(byDay).some(evs=>evs.length);
  WEEK_SUMMARY=hasAny?{week:newWeek,byDay}:null;
  saveWorkout();
  renderWorkout();
}
function dismissWeekSummary(){
  if(WEEK_SUMMARY)WEEK_SUMMARY.byDay[W.day]=[];
  renderWorkout();
}
function resetDay(){
  Object.keys(W.ex).forEach(id=>{
    const ex=getEx(id);
    W.ex[id].sets.forEach(s=>{s.done=false;if(ex)s.reps=ex.repHi;});
  });
  saveWorkout();
  skipTimer();renderWorkout();
}

      :t.protein<PF?{msg:`Add a shake — ${PF-t.protein}g short`,c:'#D09040'}
      :{msg:`${t.cal-currentMT().cal}cal over target`,c:'#D46060'};
    html+=`<div style="margin-top:12px;padding:20px;background:#181818;border:1px solid ${verdict.c}44;border-left:3px solid ${verdict.c};border-radius:10px">
      <div style="font-size:8px;letter-spacing:5px;color:#A0A0A0;margin-bottom:14px">DAY SUMMARY</div>
      ${[{l:'Calories',v:t.cal,tg:currentMT().cal,u:''},{l:'Protein',v:t.protein,tg:currentMT().protein,u:'g'},{l:'Fat',v:t.fat,tg:currentMT().fat,u:'g'},{l:'Carbs',v:t.carbs,tg:currentMT().carbs,u:'g'}].map(r=>{
        const over=r.v>r.tg*1.05,hit=r.l==='Protein'?r.v>=PF:r.v<=r.tg,c=over?'#D46060':hit?'#5ABF6A':'#D09040';
        return`<div class="summary-row">
          <span style="font-size:10px;color:#C0C0C0">${r.l}</span>
          <div><span style="font-size:15px;color:${c}">${r.v}</span><span style="font-size:9px;color:#808080">${r.u} / ${r.tg}${r.u}</span> <span>${over?'⬆':hit?'✓':'⬇'}</span></div>
        </div>`;
      }).join('')}
      <div style="margin-top:14px;padding:10px;border-radius:7px;background:${verdict.c}18;border:1px solid ${verdict.c}44;font-size:11px;color:${verdict.c};text-align:center;letter-spacing:1px">${verdict.msg}</div>
      <button onclick="resetMeal()" style="margin-top:12px;width:100%;border:1px solid #3a3a3a;border-radius:7px;color:#A0A0A0;padding:11px;font-size:8px;letter-spacing:3px">← PLAN A NEW DAY</button>
    </div>`;
  }
  html+=`</div>`;
  document.getElementById('content').innerHTML=html;
}

/* ── MEAL EVENTS ───────────────────────────────────────── */
function toggleMeal(id){M.open=M.open===id?null:id;renderMeal();}
function toggleOil(){M.oil=!M.oil;saveMeal();renderMeal();}
function chooseMeal(mid,oid){
  const mi=MMEALS.findIndex(m=>m.id===mid),ns={};
  MMEALS.slice(0,mi).forEach(m=>{if(M.sel[m.id])ns[m.id]=M.sel[m.id];});
  ns[mid]=oid;M.sel=ns;
  const nx=MMEALS[mi+1];M.open=nx?nx.id:null;
  saveMeal();renderMeal();
}
function resetMeal(){
  M.sel={};M.open='b';
  localStorage.removeItem('trn3_msel');
  localStorage.removeItem('trn3_mopen');
  renderMeal();
}

/* ── TAB + INIT ────────────────────────────────────────── */
function switchTab(tab){
  activeTab=tab;
  document.getElementById('tt').className=tab==='training'?'active':'';
  document.getElementById('tn').className=tab==='nutrition'?'active':'';
  if(tab==='training')renderWorkout();else renderMeal();
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

// Load saved state then render
loadHistory();
loadSaved();
renderWorkout();
</script>
