<script>
/* ═══ V4 — own storage namespace, never touches V3 data ═══ */
const NS='trn4_';
let SAVE_FAILED=false;
function sget(k,def){try{const v=localStorage.getItem(NS+k);return v==null?def:JSON.parse(v);}catch(e){return def;}}
function sset(k,v){try{localStorage.setItem(NS+k,JSON.stringify(v));return true;}catch(e){SAVE_FAILED=true;return false;}}

/* ── DATE HELPERS (local time, not UTC) ───────────────────── */
function p2(n){return (n<10?'0':'')+n;}
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function todayStr(){return ymd(new Date());}
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d);}
function dayDiff(a,b){return Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);}
function r1(x){return Math.round(x*10)/10;}
function r2(x){return Math.round(x*100)/100;}

/* ── TRAINING DATA ────────────────────────────────────────── */
// prog:false = warm-up / no progression. max = equipment ceiling (50 lb DBs).
const ROT=['A','B','C','D'];
const DC={A:'#D4A84A',B:'#5A9AC8',C:'#C8785A',D:'#9A7AC8'};
const DAYS={
 A:{name:'UPPER A',sub:'Push · upper chest + lateral delts first',groups:[
  {title:'WARM-UP',rest:30,ex:[{id:'fp',name:'Cable Face Pulls',sets:2,lo:15,hi:15,w:50,type:'cable',inc:5,prog:false,note:'Shoulder primer — keep it easy'}]},
  {title:'MAIN LIFTS',rest:150,ex:[{id:'ip',name:'Incline Barbell Press',sets:4,lo:6,hi:10,w:185,type:'barbell',inc:5,note:'Upper chest priority. Every set to 10 reps = add 5 lb'}]},
  {rest:120,ex:[{id:'op',name:'Barbell OHP (rack)',sets:3,lo:6,hi:10,w:115,type:'barbell',inc:5,note:'Strict press, glutes tight'}]},
  {title:'SUPERSET — LATERAL DELT + UPPER CHEST',rest:45,ss:true,ex:[
    {id:'dl',name:'DB Lateral Raises',sets:4,lo:12,hi:20,w:20,type:'dumbbell',inc:2.5,max:50,note:'Strict, no swing',swap:'Cable lateral raise or leaning single-arm raise'},
    {id:'lf',name:'Low-to-High Cable Fly',sets:4,lo:10,hi:15,w:25,type:'cable',inc:5,note:'Pulley low, cross at eye level'}]},
  {title:'FINISHER',rest:45,ex:[{id:'oe',name:'Overhead Tricep Ext (rope)',sets:2,lo:10,hi:15,w:65,type:'cable',inc:5,note:'Quick — maintenance volume'}]},
  {title:'CORE',rest:45,ex:[{id:'hl',name:'Hanging Leg Raise',sets:3,lo:8,hi:15,w:0,type:'bodyweight',inc:0,note:'No swing, curl the pelvis at the top'}]},
  {rest:45,ex:[{id:'wc',name:'Cable Woodchop (high-to-low)',sets:3,lo:10,hi:12,w:25,type:'cable',inc:5,note:'Per side — full rotation'}]}
 ]},
 B:{name:'LOWER A',sub:'Quads first · glute + hamstring touch',groups:[
  {title:'WARM-UP',rest:30,ex:[{id:'gw',name:'Goblet Squat (warm-up)',sets:2,lo:10,hi:10,w:25,type:'dumbbell',inc:2.5,prog:false,note:'Light movement prep only'}]},
  {title:'MAIN LIFTS',rest:150,ex:[{id:'gs',name:'Landmine Squat',sets:4,lo:6,hi:10,w:70,type:'free',inc:5,note:'Plates on the free end, held at chest. Every set to 10 = add 5 lb'}]},
  {rest:120,ex:[{id:'bs',name:'Bulgarian Split Squat (DB)',sets:3,lo:8,hi:12,w:30,type:'dumbbell',inc:2.5,max:50,note:'Weight per hand',swap:'Barbell split squat in the rack'}]},
  {title:'POSTERIOR',rest:75,ex:[{id:'ht',name:'Barbell Hip Thrust',sets:3,lo:8,hi:12,w:155,type:'barbell',inc:5,note:'Lighter touch — main hip thrust day is Lower B'}]},
  {title:'FINISHER',rest:45,ex:[{id:'lc',name:'Cable Leg Curl',sets:3,lo:10,hi:15,w:30,type:'cable',inc:5,note:'Ankle strap, steady tension'}]}
 ]},
 C:{name:'UPPER B',sub:'Pull · back width + rear delts + second upper chest touch',groups:[
  {title:'WARM-UP',rest:30,ex:[{id:'fp2',name:'Cable Face Pulls',sets:2,lo:15,hi:15,w:50,type:'cable',inc:5,prog:false,note:'Same as Upper A'}]},
  {title:'MAIN LIFTS',rest:150,ex:[{id:'wp',name:'Pull-Ups (bodyweight)',sets:3,lo:6,hi:10,w:0,type:'bodyweight',inc:0,note:'Wide grip. Reps first — slow 3s lowers once you pass 10',swap:'Cable pulldown focus'}]},
  {rest:120,ex:[{id:'br',name:'Barbell Row (wide grip)',sets:3,lo:6,hi:10,w:185,type:'barbell',inc:5,note:'No hip drive'}]},
  {title:'SUPERSET — BACK + REAR DELT',rest:45,ss:true,ex:[
    {id:'pd',name:'Cable Pulldown',sets:2,lo:10,hi:15,w:110,type:'cable',inc:5,note:'Depress scapula before pulling'},
    {id:'rd',name:'Bent-Over DB Rear Delt Raise',sets:2,lo:12,hi:20,w:15,type:'dumbbell',inc:2.5,max:50,note:'Raise to shoulder height'}]},
  {title:'SUPERSET — UPPER CHEST + BICEPS',rest:60,ss:true,ex:[
    {id:'di',name:'Cable Incline Press',sets:3,lo:10,hi:15,w:60,type:'cable',inc:5,note:'Second upper chest touch'},
    {id:'ic',name:'Standing DB Curl',sets:2,lo:8,hi:12,w:35,type:'dumbbell',inc:2.5,max:50,note:'Strict, standing',swap:'Barbell curl'}]},
  {title:'FINISHER',rest:45,ex:[{id:'cl',name:'Cable Lateral Raise',sets:3,lo:12,hi:20,w:20,type:'cable',inc:5,note:'Second lateral delt touch — light, strict'}]},
  {title:'CORE',rest:45,ex:[{id:'ws',name:'Weighted Sit-up (DB at chest)',sets:3,lo:10,hi:15,w:20,type:'dumbbell',inc:2.5,max:50,note:'Full range, feet anchored',swap:'Cable crunch with heavier stack'}]},
  {rest:45,ex:[{id:'cc',name:'Kneeling Cable Crunch',sets:3,lo:10,hi:15,w:60,type:'cable',inc:5,note:'Round the spine, hips stay still'}]}
 ]},
 D:{name:'LOWER B',sub:'Glutes first · hamstrings · quad touch',groups:[
  {title:'WARM-UP',rest:30,ex:[{id:'gb',name:'Bodyweight Glute Bridge',sets:2,lo:15,hi:15,w:0,type:'bodyweight',inc:0,prog:false,note:'Squeeze 1s at the top'}]},
  {title:'MAIN LIFTS',rest:150,ex:[{id:'ht2',name:'Barbell Hip Thrust',sets:4,lo:6,hi:10,w:175,type:'barbell',inc:5,note:'Main glute lift. Every set to 10 = add 5 lb'}]},
  {rest:120,ex:[{id:'rl',name:'Romanian Deadlift',sets:3,lo:8,hi:12,w:135,type:'barbell',inc:5,note:'Slow 3s lowering'}]},
  {title:'QUAD TOUCH',rest:75,ex:[{id:'gq',name:'Goblet Squat',sets:4,lo:12,hi:20,w:40,type:'dumbbell',inc:2.5,max:50,note:'Bilateral, easy on knees after RDL',swap:'Landmine goblet or front squat'}]}
 ]}
};
function allEx(){const a=[];Object.keys(DAYS).forEach(d=>DAYS[d].groups.forEach(g=>g.ex.forEach(e=>a.push({d,e,g}))));return a;}
function getEx(id){const f=allEx().find(x=>x.e.id===id);return f?f.e:null;}
function getRest(id){const f=allEx().find(x=>x.e.id===id);return f?f.g.rest:0;}
function isProg(ex){return ex.prog!==false;}
function dayIds(d){const a=[];DAYS[d].groups.forEach(g=>g.ex.forEach(e=>a.push(e.id)));return a;}

/* ── PROGRESSION ENGINE (reps first, then weight) ─────────── */
function atCeiling(ex,w){return ex.type==='bodyweight'||!!(ex.max&&w>=ex.max);}
function effHi(ex,w){return ex.hi;}
function maxSets(ex){return ex.sets+2;}
function workingWeight(sets){
  if(!sets||!sets.length)return 0;
  const counts={};
  sets.forEach(s=>{counts[s.weight]=(counts[s.weight]||0)+1;});
  let best=sets[0].weight,bestCount=0;
  Object.keys(counts).forEach(k=>{
    const w=parseFloat(k),c=counts[k];
    if(c>bestCount||(c===bestCount&&w<best)){best=w;bestCount=c;}
  });
  return best;
}
let SETUP=sget('setup',null);
let LIFT=sget('lift',{});
let ROTI=sget('rot',0);
let CUR=sget('cur',null);
let SESS=sget('sessions',[]);
let LASTSUM=sget('lastsum',null);
let GAPSEEN=sget('gapseen','');
function saveAll(){sset('lift',LIFT);sset('rot',ROTI);sset('sessions',SESS);sset('lastsum',LASTSUM);sset('gapseen',GAPSEEN);}
function getLift(id){
  const ex=getEx(id);
  if(!LIFT[id]){
    const w=SETUP&&SETUP.weights&&SETUP.weights[id]!=null?SETUP.weights[id]:ex.w;
    LIFT[id]={w:ex.type==='bodyweight'?0:w,reps:[],n:ex.sets,stall:0,deload:false,ceil:false,hist:[]};
  }
  return LIFT[id];
}
function prefillReps(ex,L,i){
  if(!isProg(ex))return ex.hi;
  const r=L.reps&&L.reps.length?(L.reps[i]!=null?L.reps[i]:L.reps[L.reps.length-1]):ex.lo;
  return Math.max(ex.lo,Math.min(effHi(ex,L.w),r));
}
function buildSession(d){
  const s={day:d,start:Date.now(),ex:{}};
  dayIds(d).forEach(id=>{
    const ex=getEx(id),L=getLift(id),n=isProg(ex)?(L.n||ex.sets):ex.sets;
    const w=isProg(ex)?L.w:ex.w;
    s.ex[id]={sets:Array.from({length:n},(_,i)=>({weight:w,reps:prefillReps(ex,L,i),done:false}))};
  });
  return s;
}
function sessionHasDone(s){return !!s&&Object.keys(s.ex).some(id=>s.ex[id].sets.some(x=>x.done));}
function ensureCur(){
  if(!CUR||!DAYS[CUR.day]){CUR=buildSession(ROT[ROTI]);}
  sset('cur',CUR);
}
function rebuildIfUntouched(){if(!sessionHasDone(CUR)){CUR=buildSession(CUR&&DAYS[CUR.day]?CUR.day:ROT[ROTI]);sset('cur',CUR);}}

function progressLift(id,sets){
  const ex=getEx(id),L=getLift(id);
  if(!isProg(ex))return null;
  const done=sets.filter(s=>s.done);
  if(!done.length){return null;}
  const w=workingWeight(done);
  const rel=done.filter(s=>s.weight===w);
  const n=sets.length;
  const hi=effHi(ex,w);
  const need=Math.min(n,3);
  const allHit=rel.length>=need&&rel.every(s=>s.reps>=hi)&&done.length>=Math.min(n,need);
  const tot=rel.reduce((a,s)=>a+s.reps,0);
  const prev=L.hist.length?L.hist[L.hist.length-1]:null;
  const relReps=rel.map(s=>s.reps);
  let outcome,newW=w,newReps;
  const ceil=atCeiling(ex,w);
  if(allHit&&!ceil){
    newW=ex.max?Math.min(ex.max,w+ex.inc):w+ex.inc;
    outcome='up';
    newReps=[];
    L.stall=0;L.ceil=false;
  }else{
    newReps=sets.map((s,i)=>(s.done&&s.weight===w)?s.reps:(L.reps[i]!=null?L.reps[i]:ex.lo));
    if(allHit&&ceil){
      if(n<maxSets(ex)){outcome='addset';L.ceil=false;newReps=sets.map(()=>Math.max(ex.lo,ex.hi-2));L.stall=0;}
      else{outcome='ceiling';L.ceil=true;}
    }else{outcome='hold';}
    if(outcome==='hold')L.ceil=false;
    if(prev&&prev.w===w&&prev.w!==undefined){
      const pt=(prev.reps||[]).reduce((a,b)=>a+b,0);
      if(tot<=pt)L.stall=(L.stall||0)+1;else L.stall=0;
    }else{L.stall=0;}
  }
  if(L.stall>=3&&ex.type!=='bodyweight'&&outcome!=='addset')L.deload=true;
  L.hist.push({d:todayStr(),w:w,reps:relReps,o:outcome});
  if(L.hist.length>40)L.hist.shift();
  L.w=ex.type==='bodyweight'?0:newW;
  L.reps=outcome==='up'?[]:newReps;
  L.n=outcome==='addset'?n+1:n;
  return{id:id,name:ex.name,outcome:outcome,w:w,newW:newW,reps:relReps,hi:hi,ceil:ceil,stall:L.stall,deload:L.deload,swap:ex.swap||''};
}
function finishWorkout(){
  if(!CUR||!sessionHasDone(CUR)){alert('Check off at least one set first.');return;}
  const d=CUR.day,items=[];
  dayIds(d).forEach(id=>{const r=progressLift(id,CUR.ex[id].sets);if(r)items.push(r);});
  const setsDone=Object.keys(CUR.ex).reduce((n,id)=>n+CUR.ex[id].sets.filter(s=>s.done).length,0);
  SESS.push({d:todayStr(),day:d,sets:setsDone});
  if(SESS.length>400)SESS=SESS.slice(-400);
  ROTI=(ROT.indexOf(d)+1)%ROT.length;
  LASTSUM={day:d,date:todayStr(),items:items,sets:setsDone};
  CUR=null;
  saveAll();sset('cur',null);
  ensureCur();
  SHOWSUM=true;
  flashSaved();renderTraining();window.scrollTo(0,0);
}
function roundTo(x,inc){const s=inc||2.5;return Math.max(0,Math.round(x/s)*s);}
function deloadLift(id){
  const ex=getEx(id),L=getLift(id);
  if(!isProg(ex)||ex.type==='bodyweight')return;
  L.w=roundTo(L.w*0.9,ex.inc);L.reps=[];L.stall=0;L.deload=false;L.ceil=false;
}
function deloadAll(){
  if(!confirm('Drop every lift about 10% and restart at the bottom of the rep range? Use this for a deload or a rough stretch.'))return;
  allEx().forEach(x=>deloadLift(x.e.id));
  saveAll();rebuildIfUntouched();renderTraining();
}
function applyLiftDeload(id){deloadLift(id);saveAll();rebuildIfUntouched();renderTraining();}
function gapLighter(){
  allEx().forEach(x=>deloadLift(x.e.id));
  GAPSEEN=SESS.length?SESS[SESS.length-1].d:'';
  saveAll();rebuildIfUntouched();renderTraining();
}
function gapDismiss(){GAPSEEN=SESS.length?SESS[SESS.length-1].d:'';saveAll();renderTraining();}

/* ── NOTICES ───────────────────────────────────────────────── */
function trainingNotices(){
  const out=[],t=todayStr();
  const last=SESS.length?SESS[SESS.length-1].d:null;
  if(last&&dayDiff(t,last)>10&&GAPSEEN!==last&&!sessionHasDone(CUR)){
    out.push(`<div class="note warn">It's been ${dayDiff(t,last)} days since your last session. Start about 10% lighter this week?
      <div style="margin-top:8px;display:flex;gap:8px"><button class="mini" onclick="gapLighter()">GO LIGHTER −10%</button><button class="mini" onclick="gapDismiss()">KEEP WEIGHTS</button></div></div>`);
  }
  const days={};SESS.forEach(s=>{days[s.d]=true;});
  let c=0,cur=days[t]?t:addDays(t,-1);
  while(days[cur]){c++;cur=addDays(cur,-1);}
  if(c>=3){out.push(`<div class="note info">${c} training days in a row${days[t]?'':' — take today off'}. ${days[t]?'Rest tomorrow.':'Your next session will be there when you are.'}</div>`);}
  return out.join('');
}

/* ── UTIL ──────────────────────────────────────────────────── */
function plates(w){
  if(w<=45)return null;
  let s=Math.round(((w-45)/2)*100)/100;
  const pl=[45,35,25,15,10,5,2.5],r=[];
  for(const p of pl)while(s>=p-.001){r.push(p);s=Math.round((s-p)*100)/100;}
  return r.length?r:null;
}
function dW(w,t){return t==='bodyweight'?'BW':w+'lb';}
function ft(s){return Math.floor(s/60)+':'+(s%60+'').padStart(2,'0');}
let FT=null;
function flashSaved(){
  const b=document.getElementById('saved-badge');if(!b)return;
  b.style.opacity='1';clearTimeout(FT);FT=setTimeout(()=>{b.style.opacity='0';},1100);
}
function saveCur(){sset('cur',CUR);flashSaved();}

/* ── TIMER ─────────────────────────────────────────────────── */
let TI=null,TM=null;
function startTimer(secs){
  if(TI)clearInterval(TI);
  TM={secs:secs,total:secs};
  document.getElementById('rt').style.display='block';
  updateTimer();
  TI=setInterval(()=>{
    TM.secs--;
    if(TM.secs<=0){clearInterval(TI);TI=null;document.getElementById('rt').style.display='none';TM=null;return;}
    updateTimer();
  },1000);
}
function updateTimer(){
  if(!TM)return;
  document.getElementById('td').textContent=ft(TM.secs);
  document.getElementById('tb').style.width=Math.min(100,Math.round(((TM.total-TM.secs)/TM.total)*100))+'%';
}
function skipTimer(){if(TI)clearInterval(TI);TI=null;TM=null;document.getElementById('rt').style.display='none';}

let SHOWSUM=false,SHOWPROG=false;
function lastLine(ex,L){
  if(!isProg(ex)||!L.hist.length)return '';
  const h=L.hist[L.hist.length-1];
  return `LAST: ${ex.type==='bodyweight'?'BW':h.w+'lb'} × ${h.reps.join(', ')}`;
}
function goalLine(ex,L){
  if(!isProg(ex))return '';
  const hi=effHi(ex,L.w);
  const nn=L.n||ex.sets;
  if(ex.type==='bodyweight')return nn<maxSets(ex)?`GOAL: every set to ${hi} reps → add a set`:`GOAL: every set to ${hi} reps → time to swap`;
  if(atCeiling(ex,L.w))return nn<maxSets(ex)?`AT ${ex.max} LB CEILING: every set to ${hi} reps → add a set`:`AT CEILING + MAX SETS: hit ${hi} on every set → swap`;
  return `GOAL: all sets ${hi} reps → +${ex.inc} lb`;
}

/* ── WORKOUT EVENTS ────────────────────────────────────────── */
function adjW(id,si,dir){
  const ex=getEx(id),sets=CUR.ex[id].sets,s=sets[si];
  if(ex.type==='bodyweight')return;
  const nw=r2(Math.max(0,Math.min(ex.max||999,s.weight+dir*ex.inc)));
  s.weight=nw;
  for(let j=si+1;j<sets.length;j++){if(!sets[j].done)sets[j].weight=nw;}
  sets.forEach((x,j)=>{
    const wv=document.getElementById('wv-'+id+'-'+j);if(wv)wv.textContent=dW(x.weight,ex.type);
    const pl=document.getElementById('pl-'+id+'-'+j);
    if(pl){const p=ex.type==='barbell'?plates(x.weight):null;pl.textContent=p?p.join('+')+' /side':'';}
  });
  saveCur();
}
function adjR(id,si,dir){
  const s=CUR.ex[id].sets[si];
  s.reps=Math.max(1,Math.min(60,s.reps+dir));
  document.getElementById('rv-'+id+'-'+si).textContent=s.reps;
  saveCur();
}
function toggleDone(id,si){
  const sets=CUR.ex[id].sets,s=sets[si],color=DC[CUR.day];
  s.done=!s.done;
  if(s.done){const r=getRest(id);if(r>0)startTimer(r);}
  saveCur();
  renderTraining();
}
function addSet(id){
  const sets=CUR.ex[id].sets,l=sets[sets.length-1]||{weight:getLift(id).w,reps:getEx(id).lo};
  sets.push({weight:l.weight,reps:l.reps,done:false});saveCur();renderTraining();
}
function remSet(id){
  const sets=CUR.ex[id].sets;if(sets.length<=1)return;
  sets.pop();saveCur();renderTraining();
}
function switchDay(d){
  if(CUR&&CUR.day===d)return;
  if(sessionHasDone(CUR)&&!confirm('Switch days? Sets you checked in the current workout will be discarded.'))return;
  CUR=buildSession(d);sset('cur',CUR);renderTraining();window.scrollTo(0,0);
}
function resetDay(){
  if(!confirm('Clear the checkmarks and reload this workout\'s planned weights and reps?'))return;
  CUR=buildSession(CUR.day);sset('cur',CUR);renderTraining();
}

/* ── BACKUP ────────────────────────────────────────────────── */
function exportBackup(){
  try{
    const data={};
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(NS)===0)data[k]=localStorage.getItem(k);}
    const json=JSON.stringify(data);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(json).then(()=>alert('Backup copied. Paste it into Notes or anywhere safe. Use Restore if progress ever resets.')).catch(()=>prompt('Copy this backup text:',json));
    }else{prompt('Copy this backup text:',json);}
  }catch(e){alert('Backup failed: '+e.message);}
}
function importBackup(){
  const json=prompt('Paste your backup text here:');
  if(!json)return;
  try{
    const data=JSON.parse(json);
    Object.keys(data).forEach(k=>{if(k.indexOf(NS)===0)localStorage.setItem(k,data[k]);});
    alert('Restored — reloading now.');location.reload();
  }catch(e){alert('Restore failed — make sure you pasted the entire backup text.');}
}

let NUT=sget('nut',{}),WT=sget('wt',{}),WAIST=sget('waist',{}),ADJ=sget('adj',{kcal:0,date:null});
let NTAB_OPEN=false;
function nDay(d){if(!NUT[d])NUT[d]={c:{},x:[]};return NUT[d];}
function planItems(){
  const it=PLAN.slice();
  if(ADJ.kcal)it.push({id:'adj',name:'Adjustment',desc:ADJ.kcal>0?'Extra rice / peanut butter to cover the added calories':'Smaller snack to cover the trimmed calories',cal:ADJ.kcal,pro:0});
  return it;
}
function nutTotals(d){
  const n=nDay(d),it=planItems();
  const planCal=it.reduce((a,x)=>a+x.cal,0),planPro=it.reduce((a,x)=>a+x.pro,0);
  let cal=0,pro=0;
  it.forEach(x=>{if(n.c[x.id]){cal+=x.cal;pro+=x.pro;}});
  n.x.forEach(x=>{cal+=x.cal;pro+=x.pro;});
  return{cal:cal,pro:pro,planCal:planCal,planPro:planPro,tCal:BASE_TARGET.cal+ADJ.kcal,tPro:BASE_TARGET.pro};
}
function toggleMeal(id){const n=nDay(todayStr());n.c[id]=!n.c[id];if(!n.c[id])delete n.c[id];sset('nut',NUT);flashSaved();renderNutrition();}
function addExtra(){
  const nm=(document.getElementById('x-name').value||'').trim()||'Off-plan',cal=parseFloat(document.getElementById('x-cal').value),pro=parseFloat(document.getElementById('x-pro').value);
  if(isNaN(cal)||cal<=0){alert('Enter the calories.');return;}
  nDay(todayStr()).x.push({name:nm,cal:Math.round(cal),pro:isNaN(pro)?0:Math.round(pro)});
  sset('nut',NUT);flashSaved();
  ['x-name','x-cal','x-pro'].forEach(i=>{const e=document.getElementById(i);if(e)e.value='';});
  renderNutrition();
}
function delExtra(i){nDay(todayStr()).x.splice(i,1);sset('nut',NUT);renderNutrition();}
function saveMetric(kind){
  const v=parseFloat(document.getElementById(kind+'-v').value),dt=document.getElementById(kind+'-d').value||todayStr();
  if(isNaN(v)||v<=0){alert('Enter a number.');return;}
  if(kind==='wt'){WT[dt]=r1(v);sset('wt',WT);}else{WAIST[dt]=r1(v);sset('waist',WAIST);}
  flashSaved();renderNutrition();
}
function delMetric(kind,dt){
  if(kind==='wt'){delete WT[dt];sset('wt',WT);}else{delete WAIST[dt];sset('waist',WAIST);}
  renderNutrition();
}
function applyAdj(delta){
  ADJ={kcal:Math.max(-600,Math.min(600,(ADJ.kcal||0)+delta)),date:todayStr()};
  sset('adj',ADJ);flashSaved();renderNutrition();
}

/* weight trend: 7-day average windows ending today */
function winAvg(map,end,k){
  const v=[];
  for(let i=0;i<7;i++){const x=map[addDays(end,-(7*k+i))];if(x!=null)v.push(x);}
  return v.length>=3?{avg:v.reduce((a,b)=>a+b,0)/v.length,n:v.length,start:addDays(end,-(7*k+6))}:null;
}
function weightStats(wt,adj,today){
  const dates=Object.keys(wt).sort();
  if(!dates.length)return{state:'none'};
  const first=dates[0],settle=addDays(first,14);
  const base=adj&&adj.date&&adj.date>settle?adj.date:settle;
  const w=[0,1,2,3].map(k=>winAvg(wt,today,k));
  const valid=k=>!!(w[k]&&w[k].start>=base);
  const rate=k=>(w[k]&&w[k+1])?(w[k].avg-w[k+1].avg):null;
  const rvalid=k=>valid(k)&&valid(k+1)&&rate(k)!=null;
  const r0=rate(0);
  const out={state:'ok',first:first,avg:w[0]?w[0].avg:null,prev:w[1]?w[1].avg:null,rate:r0,settling:dayDiff(today,first)<14,suggest:null,status:'WAIT'};
  if(!w[0]){out.status='NEED 3 WEIGH-INS THIS WEEK';return out;}
  if(r0==null){out.status='BUILDING BASELINE';return out;}
  out.status=r0<0.25?'SLOW':r0<=0.75?'ON PACE':r0<=1?'A BIT FAST':'TOO FAST';
  if(rvalid(0)&&rvalid(1)&&rvalid(2)&&rate(0)<0.25&&rate(1)<0.25&&rate(2)<0.25)out.suggest={delta:175,why:'Under 0.25 lb/week for 3 weeks in a row.'};
  if(rvalid(0)&&rvalid(1)&&rate(0)>1&&rate(1)>1)out.suggest={delta:-175,why:'Over 1 lb/week for 2 weeks in a row.'};
  return out;
}
function waistStats(waist,today,rate){
  const dates=Object.keys(waist).sort();
  if(!dates.length)return{state:'none'};
  const last=dates[dates.length-1],lv=waist[last];
  const out={state:'ok',last:last,value:lv,due:dayDiff(today,last)>=7,perMonth:null,trim:false};
  const olds=dates.filter(d=>dayDiff(last,d)>=21);
  if(olds.length){
    const o=olds[olds.length-1],days=dayDiff(last,o);
    out.perMonth=(lv-waist[o])/(days/30.44);
    if(out.perMonth>0.5&&rate!=null&&rate>=0.25)out.trim=true;
  }
  return out;
}
function sparkSVG(){
  const t=todayStr(),pts=[];
  for(let i=27;i>=0;i--){const d=addDays(t,-i);if(WT[d]!=null)pts.push({i:27-i,v:WT[d]});}
  if(pts.length<2)return '';
  const avg=[];
  for(let i=27;i>=0;i--){
    const d=addDays(t,-i),v=[];
    for(let j=0;j<7;j++){const x=WT[addDays(d,-j)];if(x!=null)v.push(x);}
    if(v.length>=2)avg.push({i:27-i,v:v.reduce((a,b)=>a+b,0)/v.length});
  }
  const all=pts.map(p=>p.v).concat(avg.map(p=>p.v)),mn=Math.min.apply(null,all)-1,mx=Math.max.apply(null,all)+1;
  const X=i=>6+(i/27)*288,Y=v=>6+(1-(v-mn)/(mx-mn))*68;
  const dots=pts.map(p=>`<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="2" fill="#666"/>`).join('');
  const line=avg.length>1?`<polyline fill="none" stroke="#D4A84A" stroke-width="2" points="${avg.map(p=>X(p.i)+','+Y(p.v)).join(' ')}"/>`:'';
  return `<svg viewBox="0 0 300 80" style="width:100%;height:80px;margin-top:8px;background:#121212;border-radius:6px">${dots}${line}</svg>
    <div style="font-size:8px;color:#666;margin-top:3px">Grey dots = daily weigh-ins · gold line = 7-day average · last 4 weeks</div>`;
}
function verdictHTML(ws,wa){
  if(ws.state==='none')return `<div class="note info">Weigh in each morning (after the bathroom, before eating) and measure your waist at the navel once a week. After the first couple of weeks this tells you whether the gain is lean.</div>`;
  const parts=[];
  const rateTxt=ws.rate!=null?`${ws.rate>=0?'+':''}${r2(ws.rate)} lb/week`:'—';
  const col=ws.status==='ON PACE'?'#5ABF6A':ws.status==='SLOW'||ws.status==='BUILDING BASELINE'||ws.status.indexOf('NEED')===0?'#D4A84A':'#D46060';
  parts.push(`<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:9px;letter-spacing:2px;color:#888">TREND</span><span style="font-size:11px;color:${col};font-weight:700">${ws.status}</span></div>
    <div style="font-size:10px;color:#ccc;margin-top:6px;line-height:1.6">7-day avg: <b>${ws.avg!=null?r1(ws.avg)+' lb':'—'}</b> · previous week: ${ws.prev!=null?r1(ws.prev)+' lb':'—'} · rate: <b>${rateTxt}</b><br><span style="color:#777">Lean target is about +0.5 lb/week (0.25 – 0.75).</span></div>`);
  if(ws.settling)parts.push(`<div style="font-size:9px;color:#D4A84A;margin-top:6px">First 2 weeks: scale jumps are mostly water and food volume. No calorie changes yet.</div>`);
  if(wa.state==='ok'){
    const pm=wa.perMonth;
    parts.push(`<div style="font-size:10px;color:#ccc;margin-top:8px">Waist: <b>${wa.value} in</b> (${wa.last})${pm!=null?` · ${pm>=0?'+':''}${r2(pm)} in/month`:' · need a reading 3+ weeks older to see a trend'}</div>`);
  }
  let sug=ws.suggest;
  if(!sug&&wa.state==='ok'&&wa.trim)sug={delta:-150,why:'Waist is growing faster than 0.5 in/month while the scale is on pace or above. Likely extra fat.'};
  if(sug){
    parts.push(`<div class="note warn" style="margin-top:8px">${sug.why} Suggest ${sug.delta>0?'adding':'trimming'} about ${Math.abs(sug.delta)} kcal/day.
      <div style="margin-top:8px"><button class="mini" onclick="applyAdj(${sug.delta})">${sug.delta>0?'ADD':'TRIM'} ${Math.abs(sug.delta)} KCAL</button></div></div>`);
  }else if(ws.status==='ON PACE'&&wa.state==='ok'&&(wa.perMonth==null||wa.perMonth<=0.5)&&!ws.settling){
    parts.push(`<div style="font-size:10px;color:#5ABF6A;margin-top:8px">✓ Rate on pace and waist under control — this looks like lean gain. Keep going.</div>`);
  }
  return `<div style="background:#161616;border:1px solid #2e2e2e;border-radius:10px;padding:12px 14px;margin-bottom:12px">${parts.join('')}</div>`;
}
function metricCard(kind,title,unit,map,ph){
  const t=todayStr(),keys=Object.keys(map).sort().reverse().slice(0,5);
  const todayV=map[t];
  return `<div style="background:#161616;border:1px solid #2e2e2e;border-radius:10px;padding:12px 14px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-size:9px;letter-spacing:2px;color:#888">${title}</span><span style="font-size:10px;color:${todayV!=null?'#5ABF6A':'#777'}">${todayV!=null?todayV+' '+unit+' today':'not logged today'}</span></div>
    <div style="display:flex;gap:6px"><input id="${kind}-v" type="number" inputmode="decimal" step="0.1" placeholder="${ph}" class="inp" style="flex:1"><input id="${kind}-d" type="date" value="${t}" class="inp" style="width:130px;font-size:12px"><button class="mini" onclick="saveMetric('${kind}')" style="padding:0 14px">LOG</button></div>
    ${keys.length?`<div style="margin-top:8px;font-size:9px;color:#888;line-height:1.9">${keys.map(k=>`${k}: <span style="color:#ddd">${map[k]}</span> <button onclick="delMetric('${kind}','${k}')" style="color:#666;padding:0 6px">✕</button>`).join('<br>')}</div>`:''}
  </div>`;
}
function bar(label,v,mx,c){
  const p=Math.min(100,Math.round(v/mx*100));
  return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:5px"><span style="color:#aaa">${label}</span><span style="color:#eee">${Math.round(v)} / ${Math.round(mx)}</span></div><div class="pbar"><div class="pfill" style="width:${p}%;background:${c}"></div></div></div>`;
}
function renderNutrition(){
  const keep={};
  document.querySelectorAll('#content input').forEach(e=>{if(e.id)keep[e.id]=e.value;});
  const t=todayStr(),n=nDay(t),T=nutTotals(t),it=planItems();
  const ws=weightStats(WT,ADJ,t),wa=waistStats(WAIST,t,ws.rate);
  const diff=T.planCal-T.tCal;
  let html=`<div class="sticky"><div class="inner">
    <div style="font-size:8px;letter-spacing:5px;color:#888;margin-bottom:10px">NUTRITION · V4 · ${t}</div>
    ${bar('Calories eaten vs target',T.cal,T.tCal,T.cal>T.tCal+150?'#D46060':'#D4A84A')}
    ${bar('Protein eaten vs target',T.pro,T.tPro,'#5ABF6A')}
    <div style="font-size:9px;color:#888;line-height:1.5">Plan adds up to <b style="color:#ddd">${T.planCal} kcal / ${T.planPro} g</b> · target <b style="color:#ddd">${T.tCal} kcal / ${T.tPro} g</b>${Math.abs(diff)>60?` <span style="color:#D4A84A">(plan is ${diff>0?'over':'under'} by ${Math.abs(diff)})</span>`:''}</div>
  </div></div><div style="max-width:560px;margin:14px auto 0;padding:0 16px">`;
  html+=`<div class="section-lbl">TODAY'S PLAN — TAP WHEN EATEN</div>`;
  it.forEach(x=>{
    const on=!!n.c[x.id];
    html+=`<button class="meal-row" onclick="toggleMeal('${x.id}')" style="border-color:${on?'#2a5a2a':'#2a2a2a'};background:${on?'#0d1a0d':'#161616'}">
      <div class="chk" style="border-color:${on?'#5ABF6A':'#444'};background:${on?'#5ABF6A':'transparent'};color:#000">${on?'✓':''}</div>
      <div style="flex:1;text-align:left"><div style="font-size:12px;color:${on?'#9fdfa8':'#F0F0F0'}">${x.name}</div><div style="font-size:9px;color:#888;line-height:1.4;margin-top:2px">${x.desc}</div></div>
      <div style="text-align:right;font-size:10px;color:#aaa;white-space:nowrap">${x.cal} kcal<br>${x.pro} g</div></button>`;
  });
  if(n.x.length){
    html+=`<div class="section-lbl" style="margin-top:14px">OFF-PLAN</div>`;
    n.x.forEach((x,i)=>{html+=`<div class="meal-row" style="border-color:#5a4a2a;background:#1a160d"><div style="flex:1;font-size:12px;color:#F0F0F0">${x.name}</div><div style="font-size:10px;color:#aaa;text-align:right">${x.cal} kcal · ${x.pro} g</div><button onclick="delExtra(${i})" style="color:#888;padding:6px 8px;font-size:14px">✕</button></div>`;});
  }
  html+=`<div style="background:#161616;border:1px solid #2e2e2e;border-radius:10px;padding:12px 14px;margin:14px 0">
    <div style="font-size:9px;letter-spacing:2px;color:#888;margin-bottom:8px">ADD A MEAL OR SNACK OFF THE PLAN</div>
    <div style="display:flex;gap:6px"><input id="x-name" placeholder="What" class="inp" style="flex:2"><input id="x-cal" type="number" inputmode="numeric" placeholder="kcal" class="inp" style="flex:1"><input id="x-pro" type="number" inputmode="numeric" placeholder="g pro" class="inp" style="flex:1"><button class="mini" onclick="addExtra()" style="padding:0 14px">ADD</button></div></div>`;
  html+=`<div class="section-lbl" style="margin-top:20px">BODY TREND</div>`;
  html+=verdictHTML(ws,wa)+metricCard('wt','MORNING WEIGHT','lb',WT,'lb')+sparkSVG()+`<div style="height:12px"></div>`+metricCard('waist','WAIST AT NAVEL · WEEKLY','in',WAIST,'inches')+
    (wa.state==='none'||wa.due?`<div class="note info">Waist check due. Same spot every time (navel), relaxed, once a week.</div>`:'');
  if(ADJ.kcal)html+=`<div style="text-align:center;margin:10px 0"><button class="mini" onclick="if(confirm('Remove the ${ADJ.kcal>0?'+':''}${ADJ.kcal} kcal adjustment?')){ADJ={kcal:0,date:todayStr()};sset('adj',ADJ);renderNutrition();}">REMOVE ${ADJ.kcal>0?'+':''}${ADJ.kcal} KCAL ADJUSTMENT</button></div>`;
  html+=`<div style="font-size:9px;color:#666;line-height:1.6;margin:16px 0 24px">Rules: lean gain ≈ 0.5 lb/week. Under 0.25 lb/week for 3 weeks → +150–200 kcal. Over 1 lb/week for 2 weeks → −150–200 kcal. First 2 weeks ignored. Waist growing over 0.5 in/month while the scale is on pace → trim. Food numbers are estimates — tweak PLAN in the code or tell me and I'll update it.</div></div>`;
  document.getElementById('content').innerHTML=html;
  Object.keys(keep).forEach(id=>{const e=document.getElementById(id);if(e&&e.type!=='date')e.value=keep[id];});
}
